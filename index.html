<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181B">
<title>Central de Comando · Ciclo A/B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Paleta derivada da codificação de cor das anilhas olímpicas */
    --red25:#C8322B;      /* 25 kg · Treino A */
    --blue20:#1F4E9C;     /* 20 kg · Treino B */
    --yellow15:#C98A06;   /* 15 kg · futebol / recarga */
    --green10:#2E7D5B;    /* 10 kg · concluído */

    --ink:#16181B;
    --ink2:#525A63;
    --ink3:#818C96;
    --bg:#E4E7E9;
    --card:#FAFBFB;
    --line:#C7CED3;
    --line2:#DDE2E5;

    --accent:var(--ink);
    --sans:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --cond:"IBM Plex Sans Condensed","IBM Plex Sans", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r:4px;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.45;
    padding:0 16px 72px;
  }
  .wrap{max-width:720px;margin:0 auto}

  /* ---------- Abas de plano ---------- */
  .topo{
    display:flex;
    align-items:stretch;
    border-bottom:1px solid var(--line);
  }
  .planos{
    display:flex;
    gap:2px;
    min-width:0;
    /* Três abas mais o botão de conta não cabem na largura de um celular. Rolar
       a faixa é o que impede a página inteira de rolar para o lado junto. */
    overflow-x:auto;
    scrollbar-width:none;
  }
  .planos::-webkit-scrollbar{display:none}
  .plano-tab{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    background:transparent;
    border:0;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    padding:16px 9px 12px;
    color:var(--ink3);
    cursor:pointer;
    white-space:nowrap;
  }
  .plano-tab em{
    font-style:normal;
    font-size:10px;
    letter-spacing:.06em;
    color:var(--ink3);
    margin-left:6px;
  }
  .plano-tab[aria-selected="true"]{
    color:var(--ink);
    border-bottom-color:var(--red25);
  }
  .plano-tab:hover{color:var(--ink)}
  #treinos:focus{outline:none}

  /* ---------- Estado da sincronização ---------- */
  .sync{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:6px;
    flex:none;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:transparent;
    border:0;
    /* Folga à esquerda maior que a dos outros lados: com três abas a faixa
       encosta aqui, e sem ela a última aba lê como colada no botão. */
    padding:16px 2px 12px 15px;
    color:var(--ink3);
    cursor:pointer;
    white-space:nowrap;
  }
  .sync:hover{color:var(--ink)}
  .sync[hidden]{display:none}
  .sync i{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--ink3);
    flex:none;
  }
  .sync.ok i{background:var(--green10)}
  .sync.pend i{background:var(--yellow15)}
  .sync.erro i{background:var(--red25)}
  .sync.voando i{animation:pulsa 1s ease-in-out infinite}
  @keyframes pulsa{50%{opacity:.25}}

  /* ---------- Diálogo de conta ---------- */
  #loginBox{
    border:0;
    padding:0;
    margin:auto;
    width:min(92vw,380px);
    background:var(--card);
    border-radius:var(--r);
    color:var(--ink);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #loginBox::backdrop{background:rgba(22,24,27,.72)}
  #loginBox form{padding:16px 14px 14px}
  #loginBox h4{
    margin:0 0 4px;
    font-family:var(--cond);
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:16px;
    font-weight:700;
  }
  #loginBox p.ajuda{
    margin:0 0 14px;
    font-size:12px;
    line-height:1.4;
    color:var(--ink2);
  }
  #loginBox label{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink3);
    margin:10px 0 4px;
  }
  #loginBox input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--r);
    background:#fff;
    font-family:var(--sans);
    font-size:16px;          /* 16px evita o zoom automático do iOS no foco */
    color:var(--ink);
  }
  .login-acoes{display:flex;align-items:center;gap:8px;margin-top:16px}
  .login-acoes .btn.primario{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
    margin-left:auto;
  }
  .login-erro{
    margin:12px 0 0;
    padding:8px 10px;
    border-left:3px solid var(--red25);
    background:#FBEDEC;
    font-size:12px;
    line-height:1.4;
    color:var(--ink2);
  }
  .login-erro[hidden]{display:none}
  .login-prefs{
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid var(--line2);
  }
  /* Escopadas em #loginBox de propósito: as regras genéricas `#loginBox label` e
     `#loginBox input` acima têm ID na frente e ganhariam de seletor de classe,
     deixando a label em display:block e a caixa com width:100%. */
  #loginBox .login-prefs label{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0;
    font-family:var(--sans);
    font-size:13px;
    letter-spacing:0;
    text-transform:none;
    color:var(--ink2);
    cursor:pointer;
  }
  #loginBox .login-prefs input{
    width:18px;
    height:18px;
    flex:none;
    margin:0;
    padding:0;
    border:0;
    border-radius:0;
    background:transparent;
    accent-color:var(--ink);
  }
  .login-quem{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink2);
    margin:0 0 4px;
    word-break:break-all;
  }

  /* ---------- Cabeçalho ---------- */
  header{padding:32px 0 8px}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink3);
    margin:0 0 10px;
  }
  h1{
    font-family:var(--cond);
    font-weight:700;
    font-size:clamp(34px,10vw,52px);
    line-height:.95;
    letter-spacing:-.01em;
    text-transform:uppercase;
    margin:0;
  }
  h1 .slash{color:var(--red25)}
  h1 .slash.bk{color:var(--yellow15)}
  .lede{
    color:var(--ink2);
    font-size:14px;
    margin:12px 0 0;
    max-width:44ch;
  }

  /* ---------- Faixa da semana ---------- */
  .week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin:24px 0 8px;
  }
  .day{
    /* Sem isto, a trilha 1fr do grid não encolhe abaixo do conteúdo: uma
       palavra sem espaço mais larga que a coluna alarga a faixa e faz a página
       inteira rolar para o lado. */
    min-width:0;
    background:var(--card);
    border:1px solid var(--line2);
    border-radius:var(--r);
    padding:8px 2px 9px;
    text-align:center;
    min-height:74px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:5px;
  }
  .day .dow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.1em;
    color:var(--ink3);
    text-transform:uppercase;
  }
  .day .mark{
    font-family:var(--cond);
    font-weight:700;
    font-size:19px;
    line-height:1;
    width:26px;height:26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--line);
    color:var(--ink3);
  }
  .day .mark.a{background:var(--red25);border-color:var(--red25);color:#fff}
  .day .mark.b{background:var(--blue20);border-color:var(--blue20);color:#fff}
  .day .mark.pt{border-color:var(--ink);color:var(--ink);font-size:11px;letter-spacing:.02em}
  .day .what{
    font-size:9.5px;
    line-height:1.15;
    color:var(--ink2);
    letter-spacing:.01em;
    padding:0 1px;
  }
  .day.today{
    background:var(--ink);
    border-color:var(--ink);
  }
  .day.today .dow{color:#fff}
  .day.today .what{color:#C9CFD3}
  .day.today .mark{border-color:#5A626B;color:#fff}
  .legend{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink3);
    letter-spacing:.04em;
    margin:0 0 4px;
  }

  /* ---------- Seções ---------- */
  section{margin-top:36px}
  .sec-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
    margin-bottom:16px;
  }
  .sec-head h2{
    font-family:var(--cond);
    text-transform:uppercase;
    font-size:15px;
    letter-spacing:.08em;
    margin:0;
    font-weight:700;
  }
  .sec-head .meta{
    margin-left:auto;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink3);
  }

  /* ---------- Cartão de treino ---------- */
  .treino{
    background:var(--card);
    border:1px solid var(--line2);
    border-top:4px solid var(--accent);
    border-radius:var(--r);
    margin-bottom:20px;
    overflow:hidden;
  }
  .treino.a{--accent:var(--red25)}
  .treino.b{--accent:var(--blue20)}
  .treino.c{--accent:var(--green10)}
  .treino.bk{--accent:var(--yellow15)}
  .t-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px 12px;
    flex-wrap:wrap;
  }
  .badge{
    font-family:var(--cond);
    font-weight:700;
    font-size:22px;
    width:38px;height:38px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .badge.sm{font-size:17px;letter-spacing:.02em}
  .t-title{display:flex;flex-direction:column;gap:1px;min-width:0}
  .t-title h3{
    font-family:var(--cond);
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:20px;
    margin:0;
    font-weight:700;
  }
  .t-title span{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink3);
    letter-spacing:.04em;
  }
  .t-prog{margin-left:auto;text-align:right;flex:0 0 auto}
  .t-prog b{
    font-family:var(--mono);
    font-size:15px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .t-prog small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .bar{height:3px;background:var(--line2)}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}

  /* ---------- Exercícios ---------- */
  ol.ex{list-style:none;margin:0;padding:0}
  ol.ex li{
    border-top:1px solid var(--line2);
    padding:12px 14px 13px;
  }
  ol.ex li.done{background:#F2F6F3}
  .ex-top{display:flex;align-items:baseline;gap:8px}
  .ex-name{font-weight:600;font-size:15px;line-height:1.25}
  .ex-presc{
    margin-left:auto;
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink2);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .flag{
    display:inline-block;
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--yellow15);
    border:1px solid currentColor;
    border-radius:2px;
    padding:0 4px;
    vertical-align:2px;
    margin-left:6px;
    cursor:help;
  }
  .flag.ok{color:var(--green10)}
  .ex-note{
    font-size:12px;
    color:var(--ink2);
    margin:6px 0 0;
    padding-left:10px;
    border-left:2px solid var(--yellow15);
  }
  .ex-note.ok{border-left-color:var(--green10)}
  .ex-bottom{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  /* `.tiro` (contador da bike) divide o visual com `.set` em vez de repetir:
     as duas são a mesma bolinha. O que não se divide é o comportamento — a
     `.set` grava no localStorage e a `.tiro` não, e por isso são classes
     separadas, cada uma com o seu ramo no handler de clique. */
  .sets{display:flex;gap:6px;flex-wrap:wrap}
  .set,.tiro{
    width:36px;height:36px;
    border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    font-family:var(--mono);
    font-size:12px;
    font-weight:500;
    color:var(--ink3);
    cursor:pointer;
    padding:0;
    transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  .set:hover,.tiro:hover{border-color:var(--ink3)}
  .set[aria-pressed="true"],.tiro[aria-pressed="true"]{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .set:focus-visible,.kg:focus-visible,button:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }
  .kgwrap{margin-left:auto;display:flex;align-items:center;gap:6px}
  .kgwrap label{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.08em}
  .kg{
    width:72px;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:var(--r);
    background:#fff;
    font-family:var(--mono);
    font-size:14px;
    text-align:right;
    color:var(--ink);
  }
  .t-foot{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-top:1px solid var(--line2);
    background:#F3F5F6;
  }
  .t-foot span{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  /* ---------- Etapas · prescrição somente leitura ----------
     Este componente é lido em cima da bike, com o corpo em movimento: uma
     etapa por linha, número grande encostado à direita sempre na mesma
     coluna, e o bloco principal destacado para ser achado sem procurar.
     Herda --accent do card, como todo componente desta página. */
  ol.etapas{list-style:none;margin:0;padding:0}
  /* O <li> é coluna, e não a linha em si: a fileira de tiros entra embaixo,
     em largura cheia. `.et-linha` é que carrega o layout de três colunas. */
  ol.etapas li{
    border-top:1px solid var(--line2);
    padding:13px 14px;
  }
  .et-linha{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .et-ord{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink3);
    width:12px;
    flex:0 0 auto;
    font-variant-numeric:tabular-nums;
  }
  .et-corpo{display:flex;flex-direction:column;gap:2px;min-width:0}
  .et-nome{
    font-family:var(--cond);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:17px;
    line-height:1.1;
  }
  .et-det{font-size:12px;color:var(--ink2);line-height:1.3}
  .et-num{
    margin-left:auto;
    flex:0 0 auto;
    font-family:var(--cond);
    font-weight:700;
    font-size:clamp(24px,7vw,30px);
    line-height:1;
    letter-spacing:-.01em;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .et-num small{
    font-family:var(--mono);
    font-weight:400;
    font-size:12px;
    color:var(--ink3);
    margin-left:3px;
  }
  ol.etapas li.forte{background:#FBF6E7}
  ol.etapas li.forte .et-nome{color:var(--accent)}
  ol.etapas li.forte .et-num{
    font-size:clamp(34px,11vw,44px);
    color:var(--accent);
  }
  ol.etapas li.forte .et-num small{color:var(--accent)}

  /* Contador de tiros. Só aparece em bloco com muitas repetições, que é onde
     dá para perder a conta — ver MIN_TIROS no script. */
  .tiros{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin:12px 0 2px;
  }
  /* 34px em vez dos 36px da `.set`: com 36 os oito tiros estouram a linha em
     390px por um fio, e o oitavo cai sozinho na linha de baixo. A diferença não
     é perceptível ao lado dos cards de força, a quebra era. */
  .tiro{width:34px;height:34px}
  .tiros-meta{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink3);
    letter-spacing:.04em;
  }
  .tiros-meta b{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .tiros-zerar{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:5px 9px;
    color:var(--ink3);
    cursor:pointer;
  }
  .tiros-zerar:hover{color:var(--ink);border-color:var(--ink3)}

  /* O critério de avanço fecha o card, que é quando ele é lido: no fim da
     sessão. Acima das etapas ele empurrava o bloco principal para fora da tela. */
  .et-avanco{
    margin:0;
    padding:12px 14px;
    border-top:1px solid var(--line2);
    font-size:12.5px;
    line-height:1.4;
    color:var(--ink2);
  }
  .et-avanco strong{color:var(--ink);font-weight:600}
  /* Sem barra de progresso para preencher: a duração da sessão não é meta. */
  .treino.leitura .t-prog b{font-size:19px}

  .btn{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:7px 12px;
    cursor:pointer;
    color:var(--ink2);
  }
  .btn:hover{border-color:var(--ink);color:var(--ink)}
  .btn.ghost{margin-left:auto}

  /* ---------- Nutrição ---------- */
  .macros{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .macro{
    background:var(--card);
    border:1px solid var(--line2);
    border-top:4px solid var(--accent);
    border-radius:var(--r);
    padding:14px;
  }
  .macro.pad{--accent:var(--ink)}
  .macro.rec{--accent:var(--yellow15)}
  .macro h3{
    font-family:var(--cond);
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:15px;
    margin:0;
    font-weight:700;
  }
  .kcal{
    display:flex;
    align-items:baseline;
    margin:6px 0 2px;
  }
  /* O número grande é o próprio campo: não existe valor derivado para
     redesenhar, então digitar nunca dispara re-render. */
  .kcal input{
    font-family:var(--cond);
    font-size:38px;
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
    width:4.2ch;
    min-width:0;
    padding:0;
    border:0;
    border-bottom:1px dashed var(--line);
    background:transparent;
    color:var(--ink);
    -moz-appearance:textfield;
  }
  .kcal input::-webkit-outer-spin-button,
  .kcal input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .kcal input:focus{outline:none;border-bottom-color:var(--accent)}
  .kcal input::placeholder{color:var(--line)}
  .kcal small{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink3);margin-left:4px}
  .when{font-size:12px;color:var(--ink2);margin:0 0 12px;line-height:1.35}
  dl{margin:0;font-family:var(--mono);font-size:13px}
  dl div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid var(--line2)}
  dl dt{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  dl dd{margin:0;display:flex;align-items:baseline;gap:3px;flex:none}
  dl dd input{
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;

<script>
/* ---------- Supabase ----------
   Chaves do projeto. A anônima é pública por design e pode ficar no fonte: quem
   protege os dados é o Row Level Security no banco, não esconder esta chave.
   Nunca colocar aqui a service_role — ela ignora o RLS.

   Enquanto as duas estiverem vazias a sincronização fica desligada e a página
   funciona exatamente como antes: só localStorage, nenhuma requisição. */
var SUPA_URL = 'https://oyxdcimzakdidprhfyid.supabase.co';
var SUPA_KEY = 'sb_publishable_dabnLFccPCB7syT-uyVAWg_u9tlfAnb';

/* ---------- Armazenamento com fallback ----------
   `bruto` fala direto com o localStorage. `store` é o que a página usa: grava
   igual e ainda marca a chave como suja, para subir na próxima sincronização.
   O pull grava por `bruto` de propósito — usar `store` ali sujaria de novo o que
   acabou de chegar do servidor, e a fila nunca esvaziaria. */
var mem = {};
var bruto = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return k in mem ? mem[k] : null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del: function(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
var store = {
  get: bruto.get,
  set: function(k,v){ bruto.set(k,v); sujar(k); },
  del: function(k){ bruto.del(k); sujar(k); }
};

/* ---------- Fila de sincronização ---------- */
var KEY_FILA    = 'fittracker.sync.fila';
var KEY_DESDE   = 'fittracker.sync.desde';
var KEY_SESSAO  = 'fittracker.sync.sessao';
var KEY_MIGRADO = 'fittracker.sync.migrado';
/* De quem é o dado que está neste localStorage. Sobrevive ao logout de
   propósito: é a única coisa que denuncia, no login seguinte, que o que está
   guardado aqui é de outra conta. */
var KEY_DONO    = 'fittracker.sync.dono';

/* A aba escolhida é preferência de aparelho, não dado de treino: sincronizar
   faria o celular pular de aba porque o tablet foi aberto. */
function sincronizavel(k){
  return k.indexOf('fittracker.') === 0 &&
         k.indexOf('fittracker.sync.') !== 0 &&
         k !== KEY_PLANO;
}

function lerFila(){
  try { return JSON.parse(bruto.get(KEY_FILA) || '[]'); } catch(e){ return []; }
}
function gravarFila(f){ bruto.set(KEY_FILA, JSON.stringify(f)); }

function sujar(k){
  if (!sincronizavel(k)) return;
  var f = lerFila();
  if (f.indexOf(k) === -1){ f.push(k); gravarFila(f); }
  pintarSync();
  agendarSync();
}

/* ---------- Sessão e chamadas ao Supabase ----------
   Tudo por fetch contra a API REST, sem SDK: mantém a página sem dependências e
   sem baixar biblioteca nenhuma na rede da academia. */
var sessao = null;
try { sessao = JSON.parse(bruto.get(KEY_SESSAO) || 'null'); } catch(e){ sessao = null; }

/* Aparelho que já estava logado antes desta versão não tem dono gravado. Sem
   preencher aqui, a primeira troca de conta nele ainda passaria batida. */
if (sessao && sessao.user && sessao.user.id && !bruto.get(KEY_DONO)){
  bruto.set(KEY_DONO, sessao.user.id);
}

function syncLigado(){ return !!(SUPA_URL && SUPA_KEY); }
function logado(){ return !!(sessao && sessao.access_token); }

function salvarSessao(s){
  sessao = s;
  if (s) bruto.set(KEY_SESSAO, JSON.stringify(s));
  else bruto.del(KEY_SESSAO);
}

function apiAuth(caminho, corpo){
  return fetch(SUPA_URL + '/auth/v1/' + caminho, {
    method:'POST',
    headers:{'apikey':SUPA_KEY, 'Content-Type':'application/json'},
    body: JSON.stringify(corpo)
  }).then(function(r){
    return r.json().then(function(j){ return {ok:r.ok, corpo:j}; },
                         function(){ return {ok:r.ok, corpo:{}}; });
  });
}

function entrar(email, senha){
  return apiAuth('token?grant_type=password', {email:email, password:senha}).then(function(r){
    if (!r.ok) throw new Error(r.corpo.error_description || r.corpo.msg || 'Não foi possível entrar.');
    salvarSessao(r.corpo);
    return r.corpo;
  });
}

function sair(){
  salvarSessao(null);
  /* O cursor do delta é por conta: zerar evita que a próxima pessoa a entrar
     neste aparelho perca o primeiro lote de mudanças.

     O dono e o `migrado` ficam. Zerar o `migrado` aqui é o que fazia `migrar()`
     re-enfileirar, no login seguinte, o localStorage de quem tinha acabado de
     sair — e como o push vem antes do pull, aquilo era gravado na conta de quem
     entrou. Os dados também ficam: a fila pode estar suja e o aparelho offline,
     e apagar aqui perderia treino que ainda não subiu. Quem trata a troca de
     conta é `enviarLogin`, que é onde se sabe quem chegou. */
  bruto.del(KEY_DESDE);
  /* Nova geração: o que estiver em voo pela conta que saiu perde a validade.
     Sem soltar o `emVoo` aqui, um sync que ficou pendurado na conta anterior
     faria o primeiro `sincronizar()` de quem entrar a seguir devolver na hora,
     e a pessoa ficaria olhando para uma tela vazia até trocar de aba. */
  geracao++;
  clearTimeout(timerSync);
  emVoo = false;
  pintarSync();
}

function renovar(){
  if (!sessao || !sessao.refresh_token) return Promise.reject(new Error('sem sessão'));
  return apiAuth('token?grant_type=refresh_token', {refresh_token: sessao.refresh_token}).then(function(r){
    if (!r.ok){ salvarSessao(null); throw new Error('sessão expirada'); }
    salvarSessao(r.corpo);
    return r.corpo;
  });
}

/* 401 significa access_token vencido: renova uma vez e repete. */
function rest(caminho, opcoes, jaRenovou){
  /* Sair no meio de um sync deixa a sessão nula entre o push e o pull, e a
     linha do Bearer estouraria em cima dela. */
  if (!logado()) return Promise.reject(new Error('sem sessão'));
  opcoes = opcoes || {};
  var h = opcoes.headers || {};
  h['apikey'] = SUPA_KEY;
  h['Authorization'] = 'Bearer ' + sessao.access_token;
  opcoes.headers = h;
  return fetch(SUPA_URL + '/rest/v1/' + caminho, opcoes).then(function(r){
    if (r.status === 401 && !jaRenovou){
      return renovar().then(function(){ return rest(caminho, opcoes, true); });
    }
    return r;
  });
}

/* ---------- Push e pull ---------- */
function push(g){
  var fila = lerFila();
  if (!fila.length) return Promise.resolve(false);
  var linhas = fila.map(function(k){ return {chave:k, valor: bruto.get(k)}; });
  return rest('estado', {
    method:'POST',
    headers:{'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates'},
    body: JSON.stringify(linhas)
  }).then(function(r){
    if (!r.ok) throw new Error('push ' + r.status);
    /* Trocou de conta enquanto isto subia: a fila agora é da conta nova, e
       mexer nela aqui apagaria o que ainda não subiu para ela. */
    if (g !== geracao) return false;
    /* Tira da fila só o que subiu: uma chave sujada durante a requisição
       continua na fila e sobe na próxima rodada. */
    var restante = lerFila().filter(function(k){ return fila.indexOf(k) === -1; });
    gravarFila(restante);
    return true;
  });
}

function pull(g){
  var desde = bruto.get(KEY_DESDE) || '1970-01-01T00:00:00Z';
  var url = 'estado?select=chave,valor,atualizado_em' +
            '&atualizado_em=gt.' + encodeURIComponent(desde) +
            '&order=atualizado_em.asc';
  return rest(url, {}).then(function(r){
    if (!r.ok) throw new Error('pull ' + r.status);
    return r.json();
  }).then(function(linhas){
    /* Estas linhas são da conta que pediu, e ela já saiu. Gravar aqui devolveria
       o treino dela ao aparelho e ainda adiantaria o cursor da conta nova. */
    if (g !== geracao) return false;
    var fila = lerFila(), mudou = false, maior = desde;
    linhas.forEach(function(l){
      if (l.atualizado_em > maior) maior = l.atualizado_em;
      /* Chave ainda suja: a versão local não subiu, então ela vence. Evita
         comparar relógio de cliente, que erra. */
      if (fila.indexOf(l.chave) > -1) return;
      var atual = bruto.get(l.chave);
      if (l.valor === null){                         /* lápide */
        if (atual !== null){ bruto.del(l.chave); mudou = true; }
      } else if (atual !== l.valor){
        bruto.set(l.chave, l.valor); mudou = true;
      }
    });
    bruto.set(KEY_DESDE, maior);
    return mudou;
  });
}

/* Toda chave de dado que existe neste aparelho, do localStorage e também do
   `mem` — o fallback de quando o localStorage recusa gravar. Uma varredura só,
   usada pela migração e pela limpeza: eram duas cópias da mesma coisa, e quem
   mexesse em uma esquecia a outra. Devolve null quando não deu para enumerar,
   porque o custo de não saber é diferente para cada chamador. */
function chavesSincronizaveis(){
  var achadas = {}, lista = [], k, i;
  try {
    for (i = 0; i < localStorage.length; i++){
      k = localStorage.key(i);
      if (sincronizavel(k)) achadas[k] = 1;
    }
  } catch(e){ return null; }
  for (k in mem){ if (sincronizavel(k)) achadas[k] = 1; }
  for (k in achadas) lista.push(k);
  return lista;
}

/* Primeira entrada neste aparelho: tudo que já está guardado precisa subir,
   senão o que foi treinado antes do login ficaria só aqui. Best effort — não
   conseguir enumerar significa não subir, que é ruim mas não estraga nada. */
function migrar(){
  if (bruto.get(KEY_MIGRADO)) return;
  var f = lerFila();
  (chavesSincronizaveis() || []).forEach(function(k){
    if (f.indexOf(k) === -1) f.push(k);
  });
  gravarFila(f);
  bruto.set(KEY_MIGRADO, '1');
}

/* Tira do aparelho o que é da conta que saiu. A fila e o cursor vão junto: os
   dois são por conta, e um cursor herdado faria o pull da conta nova começar do
   meio. O dono e a preferência de aba ficam — `sincronizavel()` já os exclui.
   Coleta antes de apagar: `localStorage.key(i)` reindexa a cada remoção.

   Devolve false se não deu para varrer. Aqui isso não é best effort: seguir em
   frente gravaria o dono novo por cima de dado que continua sendo do antigo, e
   a partir daí a checagem de troca de conta nunca mais dispararia para ele. */
function limparDados(){
  var chaves = chavesSincronizaveis();
  if (!chaves) return false;
  for (var i = 0; i < chaves.length; i++) bruto.del(chaves[i]);
  bruto.del(KEY_FILA);
  bruto.del(KEY_DESDE);
  return true;
}

/* ---------- Orquestração ---------- */
var emVoo = false;
var timerSync = null;
var ultimoErro = '';

/* Sobe a cada saída e a cada troca de conta. Uma requisição em voo é despachada
   com a geração da conta que a pediu; se a geração mudar antes da resposta
   chegar, o que voltou é de outra conta e vai fora. Sem isto, um pull lento do
   Felipe que aterrissa depois da Ana entrar reescreve o localStorage dela com o
   dado dele e ainda deixa o cursor `desde` na hora dele — e aí a Ana nunca mais
   recebe as próprias linhas neste aparelho, porque todas são anteriores ao
   cursor. Rede de academia é exatamente onde uma resposta demora esse tanto. */
var geracao = 0;

function agendarSync(){
  if (!syncLigado() || !logado()) return;
  clearTimeout(timerSync);
  /* Debounce: tocar em cinco chips vira uma requisição, não cinco. */
  timerSync = setTimeout(sincronizar, 2000);
}

function sincronizar(){
  if (!syncLigado() || !logado() || emVoo) return Promise.resolve();
  if (!navigator.onLine){ pintarSync(); return Promise.resolve(); }
  var g = geracao;
  emVoo = true;
  ultimoErro = '';
  pintarSync();
  /* Push antes de pull, sempre: assim o pull nunca sobrescreve edição local
     que ainda não subiu. */
  return push(g).then(function(){ return pull(g); }).then(function(mudou){
    if (mudou){ renderCabecalho(); render(); renderNutri(); }
  }).catch(function(e){
    if (g !== geracao) return;                 /* erro de conta que já saiu */
    ultimoErro = e && e.message ? e.message : 'falha';
  }).then(function(){
    if (g !== geracao) return;                 /* quem manda agora é a rodada nova */
    emVoo = false;
    pintarSync();
  });
}
/* Cada plano tem o seu prefixo de persistência. O do Ciclo A/B não muda nunca:
   é onde já estão as cargas e as séries salvas no navegador.

   NÃO EXISTE MAIS FASE. A prescrição desenhada é sempre a cheia, nos dois
   planos, e por isso não há mais `KEY_MODO`, `seriesDe()` nem a faixa de
   botões. A chave `fittracker.ab.v1.modo` continua gravada em quem já usava a
   página, órfã: nenhum código a lê. Deixar é de propósito — apagar seria
   escrever lápide (e propagá-la a todos os aparelhos) para limpar um dado
   inerte de alguns bytes, e o valor antigo é o que a fase retomaria se um dia
   ela voltar. Só não confundir com `fittracker.plano.v1`, que é a aba. */
var KEY_AB = 'fittracker.ab.v1.';
var KEY_PPL = 'fittracker.ppl.v1.';
var KEY_PLANO = 'fittracker.plano.v1';

/* ---------- Dados ----------
   Um objeto por plano. `key` é o prefixo de persistência, e trocar de aba nunca
   mistura séries nem cargas entre planos.

   O `id` de cada exercício é contratual: serve de chave de persistência e de nome
   do arquivo em assets/ex/. Renomear `n` é livre; renomear `id` zera a carga salva
   e quebra o caminho da ilustração.
   `img:1` marca que existe assets/ex/<id>.webp e faz aparecer o ícone de mídia.
   `semKg:1` esconde o campo de carga (aquecimento, tempo). */
var planos = [
  {
    id:'ab',
    aba:'A/B',
    key:KEY_AB,
    doc:'Central de Comando · Ciclo A/B',
    eyebrow:'Central de comando · Ganho de massa',
    titulo:'Ciclo <span class="slash">A</span>/<span class="slash">B</span>',
    lede:'Duas sessões próprias por semana, sozinho, somadas aos treinos com a personal na terça e na sexta. Cada grupo muscular uma vez, sem rotação móvel.',
    legenda:'SEMANA FIXA · hoje em destaque',
    semana:[
      {dow:'Seg', mark:'·', what:'Leve: bike ou natação'},
      {dow:'Ter', mark:'PT', cls:'pt', what:'Personal + futebol'},
      {dow:'Qua', mark:'·', what:'Repouso'},
      {dow:'Qui', mark:'B', cls:'b', what:'Superiores, solo'},
      {dow:'Sex', mark:'PT', cls:'pt', what:'Personal'},
      {dow:'Sáb', mark:'·', what:'Leve + pesagem'},
      {dow:'Dom', mark:'A', cls:'a', what:'Pernas, solo'}
    ],
    treinos:[
      {
        id:'B', cls:'b', nome:'Superiores', sub:'Quinta · sozinho',
        ex:[
          {id:'puxada-frontal', n:'Puxada Frontal', s:4, r:'10'},
          {id:'remada-articulada', n:'Remada Articulada', s:4, r:'10'},
          {id:'remada-baixa', n:'Remada Baixa', s:4, r:'12'},
          {id:'pullover', n:'Pullover Máquina', s:3, r:'15'},
          {id:'supino-inclinado', n:'Supino Inclinado Máquina', s:4, r:'10'},
          {id:'supino-reto', n:'Supino Reto Máquina', s:4, r:'10'},
          {id:'desenvolvimento-ombros', n:'Desenv. Ombros Máquina', s:4, r:'10'},
          {id:'elevacao-lateral', n:'Elevação Lateral Máquina', s:4, r:'12'},
          {id:'rosca-scott', n:'Rosca Scott Máquina', s:4, r:'10-12'},
          {id:'triceps', n:'Tríceps Máquina', s:4, r:'10-12'},
          {id:'abdominal-pulley', n:'Abdominal no Pulley', s:4, r:'20', flag:'Lombar',

/* ---------- Nutrição ----------
   A estrutura (quais cards, quais linhas, os rótulos) é template e continua no
   código. O que é de cada pessoa são só os VALORES, e esses vivem no
   localStorage e sobem para o Supabase como qualquer outra chave — mesma fila,
   mesma lápide, mesmo RLS. Nada de sincronização nova foi preciso.

   Chave: fittracker.nutri.v1.<card>.<campo>

   Quem entra sem nenhum valor vê o mesmo componente com os campos vazios, para
   preencher. Não existe semente automática: os números de uma pessoa não podem
   aparecer como se fossem os da outra. */

/* ---------- Estado visível da sincronização ----------
   Fica fora de #planos e de #treinos, então sobrevive a render() e a
   renderAbas(); é sempre esta função que reescreve o botão. */
function pintarSync(){
  var el = document.getElementById('sync');
  if (!el) return;
  /* Mostrar ou esconder este botão muda a largura que sobra para a faixa de
     abas. No primeiro desenho ele ainda está escondido, então renderAbas() mede
     uma faixa mais larga do que a real e conclui que tudo cabe. Só se refaz a
     conta quando a visibilidade vira, e não a cada pintura: em faixa rolada à
     mão, repetir a cada sincronização puxaria a aba de volta sem motivo. */
  var escondidoAntes = el.hidden;
  if (!syncLigado()){ el.hidden = true; if (!escondidoAntes) mostrarAbaAtiva(); return; }
  el.hidden = false;

  var cls = '', texto;
  if (!logado()){
    texto = 'entrar';
  } else {
    var pend = lerFila().length;
    if (emVoo){ cls = 'voando'; texto = 'sincronizando'; }
    else if (!navigator.onLine){ cls = 'pend'; texto = pend ? 'offline · ' + pend : 'offline'; }
    else if (ultimoErro){ cls = 'erro'; texto = 'erro'; }
    else if (pend){ cls = 'pend'; texto = pend + ' pendente' + (pend > 1 ? 's' : ''); }
    else { cls = 'ok'; texto = 'sincronizado'; }
  }
  el.className = 'sync' + (cls ? ' ' + cls : '');
  el.innerHTML = '<i></i>' + texto;
  el.setAttribute('aria-label',
    logado() ? 'Sincronização: ' + texto + '. Abrir opções da conta.' : 'Entrar na conta');

  /* Só aqui, e não junto do `hidden` acima: botão visível mas ainda sem texto
     não ocupa a largura que vai ocupar, e a faixa mediria como se coubesse. */
  if (escondidoAntes) mostrarAbaAtiva();
}

/* ---------- Diálogo de conta ---------- */
function abrirLogin(){
  var box = document.getElementById('loginBox');
  var campos = document.getElementById('loginCampos');
  var erro = document.getElementById('loginErro');
  var enviar = document.getElementById('loginEnviar');
  var ajuda = document.getElementById('loginAjuda');
  erro.hidden = true;
  enviar.disabled = false;

  if (logado()){
    var quem = (sessao.user && sessao.user.email) || 'sessão ativa';
    campos.innerHTML = '<p class="login-quem">' + esc(quem) + '</p>';
    ajuda.textContent = 'O progresso deste aparelho sobe para a sua conta e volta em qualquer outro.';
    enviar.textContent = 'Sair';
  } else {
    ajuda.textContent = 'Entrar sincroniza o progresso entre os aparelhos. Sem entrar, tudo continua salvo só neste navegador.';
    enviar.textContent = 'Entrar';
    /* Abrir o diálogo logado troca estes campos pelo nome de quem está logado,
       então depois de sair eles precisam voltar. Sem isto, sair e entrar de novo
       só era possível recarregando a página — que é justamente o caminho que a
       recusa por fila suja pede para percorrer. */
    if (!document.getElementById('loginEmail')){
      campos.innerHTML =
        '<label for="loginEmail">E-mail</label>' +
        '<input id="loginEmail" name="email" type="email" autocomplete="username" ' +
               'inputmode="email" autocapitalize="none" spellcheck="false" required>' +
        '<label for="loginSenha">Senha</label>' +
        '<input id="loginSenha" name="senha" type="password" autocomplete="current-password" required>';
    }
    var u = new URLSearchParams(location.search).get('u');
    var email = document.getElementById('loginEmail');
    if (email && u && !email.value) email.value = u;
  }
  document.getElementById('prefSemana').checked = mostrarSemana();
  box.showModal();
}

function enviarLogin(ev){
  ev.preventDefault();
  var box = document.getElementById('loginBox');
  var erro = document.getElementById('loginErro');
  var enviar = document.getElementById('loginEnviar');

  if (logado()){ sair(); box.close(); return; }

  var email = document.getElementById('loginEmail').value.trim();
  var senha = document.getElementById('loginSenha').value;
  /* Antes de entrar, porque entrar troca a sessão. */
  var donoAntes = bruto.get(KEY_DONO);
  erro.hidden = true;
  enviar.disabled = true;
  enviar.textContent = 'Entrando…';

  entrar(email, senha).then(function(s){
    var dono = s.user && s.user.id;

    /* Sem saber de quem é a sessão não dá para dizer se o dado daqui é dela.
       Uma guarda contra gravar na conta errada tem que falhar fechada. */
    if (!dono){
      salvarSessao(null);
      throw new Error('A resposta do servidor não disse de quem é a conta. Tente de novo.');
    }

    /* Conta diferente da que deixou dado aqui: o localStorage é de outra
       pessoa. Deixar passar faria o push (que vem antes do pull) gravar o
       treino de um na conta do outro, com hora nova — e o RLS não impede,
       porque a escrita é autenticada como quem entrou. */
    if (donoAntes && donoAntes !== dono){
      var pend = lerFila().length;
      if (pend){
        /* Subir agora escreveria na conta errada; apagar perderia treino de
           verdade. Nenhuma das duas é do computador decidir. */
        salvarSessao(null);
        throw new Error('Este aparelho tem ' + pend + (pend > 1 ? ' mudanças' : ' mudança') +
                        ' da conta anterior ainda sem enviar. Entre com ela, espere sincronizar, ' +
                        'e só então troque de conta.');
      }
      if (!limparDados()){
        salvarSessao(null);
        throw new Error('Não foi possível limpar os dados da conta anterior neste navegador. ' +
                        'Sem isso, o treino de um iria para a conta do outro.');
      }
      /* Conta nova a partir daqui: o que a anterior deixou em voo não vale
         mais, e o `sincronizar()` lá embaixo precisa ser uma rodada nova. */
      geracao++;
      emVoo = false;
      /* Repintar aqui, e não deixar para o pull: se a conta nova ainda não tem
         nada, o pull volta vazio, `sincronizar()` não redesenha, e a tela
         continuaria mostrando o treino de quem saiu. */
      renderCabecalho(); render(); renderNutri();
    }
    bruto.set(KEY_DONO, dono);

    document.getElementById('loginSenha').value = '';
    box.close();
    /* Só aparelho que nunca teve conta tem dado solto para subir. Se já teve, o
       que estava aqui ou já subiu, ou acabou de ser apagado por ser de outra
       conta — re-enfileirar carimbaria hora nova em valor velho e derrubaria o
       que outro aparelho gravou depois. */
    if (!donoAntes) migrar();
    pintarSync();
    return sincronizar();
  }).catch(function(e){
    erro.textContent = e && e.message ? e.message : 'Não foi possível entrar.';
    erro.hidden = false;
  }).then(function(){
    enviar.disabled = false;
    enviar.textContent = logado() ? 'Sair' : 'Entrar';
  });
}

    '<path d="M2.5 11.5l3.2-3.2 2.4 2.4 2.6-2.6 2.8 2.8" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg>';

function midiaDe(e){ return (MIDIA_ATIVA && e.img) ? MEDIA_DIR + e.id + '.webp' : ''; }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

/* ---------- Semana e cabeçalho ----------
   Tudo isto vive fora de #treinos, então é reescrito por renderCabecalho() na
   troca de aba, e não por render(). Nenhum listener é religado: a delegação no
   document cobre os dois. */
function renderSemana(p){
  var hoje = new Date().getDay();          // 0 domingo
  var idx = hoje === 0 ? 6 : hoje - 1;     // 0 segunda
  var html = '';
  p.semana.forEach(function(d,i){
    html += '<div class="day' + (i===idx ? ' today' : '') + '">' +
              '<span class="dow">' + d.dow + '</span>' +
              '<span class="mark ' + (d.cls || '') + '">' + d.mark + '</span>' +
              '<span class="what">' + d.what + '</span>' +
            '</div>';
  });
  document.getElementById('week').innerHTML = html;
}

function renderAbas(){
  var html = '';
  planos.forEach(function(p){
    var on = p.id === planoId;
    html += '<button class="plano-tab" type="button" role="tab" id="aba-' + p.id + '" ' +
            'aria-selected="' + on + '" aria-controls="treinos" ' +
            'tabindex="' + (on ? '0' : '-1') + '" data-plano="' + p.id + '">' +
            p.aba + (p.abaTag ? '<em>' + p.abaTag + '</em>' : '') + '</button>';
  });
  document.getElementById('planos').innerHTML = html;
  mostrarAbaAtiva();
}

/* A faixa rola quando as abas não cabem, que é o caso de um celular estreito com
   três planos. Sem trazer a aba escolhida para dentro da vista, abrir a página já
   na última mostra ela cortada no meio da palavra.

   Por retângulo, e não por offsetLeft: nada aqui é `position:relative`, então o
   offsetParent dos botões é o body e a conta sairia deslocada. E só mexe no
   scroll quando a aba está mesmo fora da vista — chamada em cima de uma faixa
   já rolada à mão, não pode puxá-la de volta. */
function mostrarAbaAtiva(){
  var nav = document.getElementById('planos');
  var sel = nav.querySelector('[aria-selected="true"]');
  if (!sel || nav.scrollWidth <= nav.clientWidth) return;
  var rn = nav.getBoundingClientRect(), rs = sel.getBoundingClientRect();
  if (rs.right > rn.right) nav.scrollLeft += rs.right - rn.right;
  else if (rs.left < rn.left) nav.scrollLeft -= rn.left - rs.left;
}

function renderCabecalho(){
  var p = planoAtual();
  document.getElementById('eyebrow').textContent = p.eyebrow;
  document.getElementById('titulo').innerHTML = p.titulo;
  document.getElementById('lede').textContent = p.lede;
  document.getElementById('legenda').textContent = p.legenda || '';
  document.getElementById('treinos').setAttribute('aria-labelledby', 'aba-' + p.id);
  document.title = p.doc;
  renderAbas();

  /* Plano sem `semana` (a bike) não desenha faixa nenhuma — o calendário é do
     ciclo de força, e na bike ele só ocupava a primeira tela. A preferência
     continua valendo para quem tem faixa. */
  var ver = !!p.semana && mostrarSemana();
  document.getElementById('week').hidden = !ver;
  document.getElementById('legenda').hidden = !ver;
  if (ver) renderSemana(p);
  else document.getElementById('week').innerHTML = '';
}

function trocarPlano(id){
  if (id === planoId) return;
  planoId = id;
  store.set(KEY_PLANO, id);
  renderCabecalho();
  render();
  var aba = document.getElementById('aba-' + id);
  if (aba) aba.focus();
}

/* ---------- Prescrição somente leitura ----------
   A bike não tem estado: esta função não lê nem grava chave nenhuma, e por isso
   nada daqui entra na fila de sincronização. Desenha a sessão inteira em ordem,
   com o bloco principal destacado — é o que se procura no meio da série. */
/* A partir de quantas repetições a etapa ganha contador. Abaixo disso dá para
   guardar de cabeça, e a fileira só ocuparia tela. */
var MIN_TIROS = 4;

/* Quantos tiros já saíram, por índice de etapa. Vive em memória e mais nada:
   o contador é do treino de hoje, não um registro. Gravar no localStorage
   quebraria o contrato desta aba e ainda faria a sessão de segunda começar com
   os oito tiros marcados.

   Em memória, e não só no DOM, porque render() roda de novo por fora — o pull
   redesenha a página quando traz mudança, e isso acontece toda vez que a aba
   volta ao primeiro plano. Sem guardar aqui, destravar o celular no meio do
   bloco apagaria a contagem. */
var tiros = {};

function renderLeitura(plano){
  var s = plano.sessao;
  var html = '<article class="treino ' + s.cls + ' leitura">' +
    '<div class="t-head">' +
      '<div class="badge' + (s.badge.length > 1 ? ' sm' : '') + '">' + s.badge + '</div>' +
      '<div class="t-title"><h3>' + s.nome + '</h3><span>' + s.sub + '</span></div>' +
      '<div class="t-prog"><b>' + s.dur + '</b><small>' + s.durUn + '</small></div>' +
    '</div>' +
    '<ol class="etapas">';

  s.etapas.forEach(function(e, i){
    html += '<li' + (e.forte ? ' class="forte"' : '') + '>' +
      '<div class="et-linha">' +
        '<span class="et-ord">' + (i + 1) + '</span>' +
        '<div class="et-corpo">' +
          '<span class="et-nome">' + e.n + '</span>' +
          (e.det ? '<span class="et-det">' + e.det + '</span>' : '') +
        '</div>' +
        '<span class="et-num">' + e.num + '<small>' + e.un + '</small></span>' +
      '</div>' +
      tirosHtml(e, i) +
    '</li>';
  });

  html += '</ol>' +
    (s.avanco ? '<p class="et-avanco">' + s.avanco + '</p>' : '') +
    '<div class="t-foot"><span>' + s.rodape + '</span></div></article>';

  document.getElementById('treinos').innerHTML = html;
  document.getElementById('totalMeta').textContent = s.meta;
  s.etapas.forEach(function(e, i){ if (temTiros(e)) pintarTiros(i); });
}

function temTiros(e){ return e.reps >= MIN_TIROS; }

function tirosHtml(e, i){
  if (!temTiros(e)) return '';
  var html = '<div class="tiros" data-etapa="' + i + '"><div class="sets">';
  for (var t = 1; t <= e.reps; t++){
    html += '<button class="tiro" type="button" aria-pressed="false" ' +
            'aria-label="Tiro ' + t + ' de ' + e.reps + ' · ' + esc(e.n) + '" ' +
            'data-etapa="' + i + '" data-tiro="' + t + '">' + t + '</button>';
  }
  return html + '</div><span class="tiros-meta">' +
    '<span><b data-tiros-prog="' + i + '">0</b>/' + e.reps + '</span>' +
    '<button class="tiros-zerar" type="button" data-tiros-zerar="' + i + '">Zerar</button>' +
  '</span></div>';
}

function pintarTiros(i){
  var feitos = tiros[i] || 0;
  var caixa = document.querySelector('.tiros[data-etapa="' + i + '"]');
  if (!caixa) return;
  caixa.querySelectorAll('.tiro').forEach(function(b){
    b.setAttribute('aria-pressed', String(+b.dataset.tiro <= feitos));
  });
  var prog = document.querySelector('[data-tiros-prog="' + i + '"]');
  if (prog) prog.textContent = feitos;
}

/* ---------- Treinos ---------- */
function render(){
  var plano = planoAtual();
  if (plano.leitura){ renderLeitura(plano); return; }
  var KEY = plano.key;
  var total = 0;
  var html = '';
  plano.treinos.forEach(function(t){
    /* `e.s` direto: a prescrição desenhada é sempre a cheia. Não existe mais
       fase para cortar série nenhuma — ver o comentário em KEY_AB. */
    var soma = t.ex.reduce(function(a,e){ return a + e.s; }, 0);
    total += soma;
    html += '<article class="treino ' + t.cls + '" data-t="' + t.id + '">' +
      '<div class="t-head">' +
        '<div class="badge' + (t.id.length > 1 ? ' sm' : '') + '">' + t.id + '</div>' +
        '<div class="t-title"><h3>' + t.nome + '</h3><span>' + t.sub + '</span></div>' +
        '<div class="t-prog"><b data-prog="' + t.id + '">0/' + soma + '</b><small>séries</small></div>' +
      '</div>' +
      '<div class="bar"><i data-bar="' + t.id + '"></i></div>' +
      '<ol class="ex">';

    t.ex.forEach(function(e){
      var ns = e.s;
      var chips = '';
      for (var s = 1; s <= ns; s++){
        var k = KEY + t.id + '.' + e.id + '.' + s;
        var on = store.get(k) === '1';
        chips += '<button class="set" type="button" aria-pressed="' + on + '" ' +
                 'aria-label="Série ' + s + ' de ' + e.n + '" ' +
                 'data-k="' + k + '" data-t="' + t.id + '">' + s + '</button>';
      }
      var kgKey = KEY + 'kg.' + t.id + '.' + e.id;
      var kgVal = store.get(kgKey) || '';
      var mid = midiaDe(e);
      html += '<li data-ex="' + e.id + '">' +
        '<div class="ex-top">' +
          '<span class="ex-name">' + e.n +
            (e.flag ? '<span class="flag' + (e.flagOk ? ' ok' : '') + '" title="' +
              (e.flagOk ? 'Ajuste já definido pela personal' : 'Ponto a confirmar com a personal') +
              '">' + e.flag + '</span>' : '') +
            (mid ? '<button class="ex-media" type="button" data-media="' + esc(mid) + '" ' +
              'data-nome="' + esc(e.n) + '" aria-label="Ver ilustração de ' + esc(e.n) + '">' +
              ICON_MIDIA + '</button>' : '') +
          '</span>' +
          '<span class="ex-presc">' + ns + ' × ' + e.r + '</span>' +
        '</div>' +
        (e.nota ? '<p class="ex-note' + (e.notaOk ? ' ok' : '') + '">' + e.nota + '</p>' : '') +
        '<div class="ex-bottom">' +
          '<div class="sets">' + chips + '</div>' +
          (e.semKg ? '' :
            '<div class="kgwrap"><label for="' + kgKey + '">KG</label>' +
            '<input class="kg" id="' + kgKey + '" type="text" inputmode="decimal" ' +
            'data-dec="1" autocomplete="off" ' +
            'value="' + kgVal + '" data-campo="' + kgKey + '" placeholder="—"></div>') +
        '</div>' +
      '</li>';
    });

    html += '</ol>' +
      '<div class="t-foot">' +
        '<span>' + soma + ' séries · ' + t.ex.length + ' exercícios</span>' +
        '<button class="btn ghost" data-reset="' + t.id + '">Zerar treino ' + t.id + '</button>' +
      '</div>' +
    '</article>';
  });

  document.getElementById('treinos').innerHTML = html;
  document.getElementById('totalMeta').textContent = total + ' séries por semana';
  plano.treinos.forEach(function(t){ updateProg(t.id); });
}

function updateProg(id){
  var card = document.querySelector('[data-t="' + id + '"]');
  if (!card) return;
  var chips = card.querySelectorAll('.set');
  var done = card.querySelectorAll('.set[aria-pressed="true"]').length;
  document.querySelector('[data-prog="' + id + '"]').textContent = done + '/' + chips.length;
  document.querySelector('[data-bar="' + id + '"]').style.width =
    (chips.length ? (done / chips.length * 100) : 0) + '%';
  card.querySelectorAll('li').forEach(function(li){
    var all = li.querySelectorAll('.set');
    var ok = li.querySelectorAll('.set[aria-pressed="true"]').length;
    li.classList.toggle('done', all.length > 0 && ok === all.length);
  });
}

/* ---------- Mídia: overlay ---------- */
var mediaBox = document.getElementById('mediaBox');
var mediaImg = document.getElementById('mediaImg');
var mediaErro = mediaBox.querySelector('.mb-erro');

mediaImg.addEventListener('error', function(){
  /* Só interessa quando há um src de verdade: limpar o src no fechamento
     também dispara 'error' em alguns navegadores. */
  if (!this.getAttribute('src')) return;
  this.hidden = true;
  mediaErro.hidden = false;
});

function abrirMidia(src, nome){
  document.getElementById('mediaTitulo').textContent = nome;
  mediaErro.hidden = true;
  mediaImg.hidden = false;
  mediaImg.alt = 'Ilustração: ' + nome;
  mediaImg.src = src;          // única requisição de imagem da página
  mediaBox.showModal();
}

document.addEventListener('click', function(ev){
  if (ev.target.closest('#sync')){ abrirLogin(); return; }
  if (ev.target.closest('[data-fechar-login]')){ document.getElementById('loginBox').close(); return; }
  if (ev.target === document.getElementById('loginBox')){ document.getElementById('loginBox').close(); return; }

  var aba = ev.target.closest('[data-plano]');
  if (aba){ trocarPlano(aba.dataset.plano); return; }

  var med = ev.target.closest('[data-media]');
  if (med){
    abrirMidia(med.dataset.media, med.dataset.nome);
    return;
  }
  if (ev.target.closest('.mb-close')){ mediaBox.close(); return; }
  if (ev.target === mediaBox){ mediaBox.close(); return; }   /* toque no backdrop */

  /* Contador de tiros. Antes do ramo de `.set` só por proximidade de assunto —
     as classes são distintas, então a ordem não decide nada. O que decide é o
     que cada uma faz: esta não chama `store`, e é por isso que a aba continua
     sem gravar nada. */
  var tiro = ev.target.closest('.tiro');
  if (tiro){
    var i = tiro.dataset.etapa, n = +tiro.dataset.tiro;
    /* Cumulativo, e não oito interruptores soltos: tiro é sequência, e a
       pergunta é "em qual eu estou". Tocar no último marcado volta um, que é o
       conserto de quem errou o dedo com a mão suada. */
    tiros[i] = (tiros[i] === n) ? n - 1 : n;
    pintarTiros(i);
    return;
  }
  var zerar = ev.target.closest('[data-tiros-zerar]');
  if (zerar){
    tiros[zerar.dataset.tirosZerar] = 0;
    pintarTiros(zerar.dataset.tirosZerar);
    return;
  }

  var set = ev.target.closest('.set');
  if (set){
    var on = set.getAttribute('aria-pressed') === 'true';
    set.setAttribute('aria-pressed', String(!on));
    if (on) store.del(set.dataset.k); else store.set(set.dataset.k, '1');
    updateProg(set.dataset.t);
    return;
  }
  /* Único zerar que existe: por treino, no rodapé do card. Varre o DOM, então
     nunca alcança o outro plano nem o treino vizinho. */
  var rst = ev.target.closest('[data-reset]');
  if (rst){
    var id = rst.dataset.reset;
    document.querySelectorAll('[data-t="' + id + '"] .set').forEach(function(b){
      b.setAttribute('aria-pressed','false');
      store.del(b.dataset.k);
    });
    updateProg(id);
    return;
  }
});

/* Navegação por setas entre as abas, como manda o padrão de tablist.
   Delegado no document pelo mesmo motivo do clique: renderAbas() reescreve os
   botões a cada troca. */
document.addEventListener('keydown', function(ev){
  var aba = ev.target.closest('[data-plano]');
  if (!aba) return;
  var passo = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : 0;
  if (ev.key === 'Home') passo = -planos.length;
  if (ev.key === 'End') passo = planos.length;
  if (!passo) return;
  ev.preventDefault();
  var i = 0;
  planos.forEach(function(p,k){ if (p.id === aba.dataset.plano) i = k; });
  i = Math.max(0, Math.min(planos.length - 1, i + passo));
  trocarPlano(planos[i].id);
});

/* Submit delegado: o formulário precisa ser <form> de verdade para o Enter e
   para os gerenciadores de senha funcionarem. Delegado pelo mesmo motivo dos
   outros — um listener só, no document. */
document.addEventListener('submit', function(ev){
  if (ev.target.id === 'loginForm') enviarLogin(ev);
});

/* Um handler só para todo campo que guarda valor: carga dos exercícios e
   macros da nutrição. O atributo carrega a chave, então não há tabela de
   correspondência para manter em sincronia. Campo vazio apaga a chave, que é o
   que vira lápide e apaga também no servidor. */
document.addEventListener('change', function(ev){
  var pref = ev.target.closest('[data-pref]');
  if (pref){
    if (pref.checked) store.del(KEY_SEMANA);      /* ligada é o padrão: sem chave */
    else store.set(KEY_SEMANA, '0');
    renderCabecalho();
    return;
  }

  var campo = ev.target.closest('[data-campo]');
  if (!campo) return;
  var v = campo.value.trim();
  /* Campo decimal (a carga) chega com vírgula: o teclado do iPhone mostra o
     separador da região, e em pt-BR é ela. Normalizar aqui e devolver o valor
     ao campo — gravar "10,5" faria o número voltar diferente em quem lê com
     ponto, e ver "10,5" virar "10.5" é o retorno de que entrou. */
  if (campo.dataset.dec){
    v = normDec(v);
    campo.value = v;
  }
  if (v === '') store.del(campo.dataset.campo);
  else store.set(campo.dataset.campo, v);
});

/* A carga é `type="text"`, e não `type="number"`, justamente para chegar aqui.
   `type="number"` só reconhece o ponto como separador, em qualquer idioma, e
   REJEITA A TECLA da vírgula: o caractere não chega a ser inserido, a tela não
   muda, e nada indica que algo foi recusado. Quem digitava "10,5" no celular
   ficava com "105" salvo em silêncio — o defeito não era perder a carga, era
   gravar carga errada, dez vezes maior, sem aviso.
   (Valor com vírgula que chegasse pelo `value=` do render viraria "" de fato, e
   aí sim o handler apagaria a chave. Pelo `type="number"` esse valor nunca
   conseguia ser salvo, então o caminho não era alcançado — anotado porque ele
   volta a existir se alguém trouxer `type="number"` de volta.)
   Sem `type="number"` também não há `min`/`step` para segurar sinal e letra, e
   é o que esta função faz. */
function normDec(v){
  v = v.replace(/,/g, '.').replace(/[^0-9.]/g, '');
  var p = v.split('.');
  if (p.length > 2) v = p.shift() + '.' + p.join('');   /* "1.2.3" -> "1.23" */
  /* Arredondar as pontas: ",5" e "100," são digitação legítima, mas ".5" e
     "100." iriam gravados e mostrados assim nos dois aparelhos. */
  v = v.replace(/\.$/, '').replace(/^\./, '0.');   /* "." sozinho zera, não vira 0 */
  return v;
}

renderCabecalho();
render();
renderNutri();
pintarSync();

/* ---------- Gatilhos de sincronização ----------
   A página já renderizou do localStorage antes de qualquer um destes disparar:
   nada aqui atrasa a primeira pintura. */
/* O service worker é o que faz a página abrir sem sinal. Registrado depois da
   primeira pintura para não competir com ela. */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* sem SW, a página só perde o offline */ });
  });
}

if (syncLigado()){
  sincronizar();
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) sincronizar();
  });
  window.addEventListener('online', function(){ pintarSync(); sincronizar(); });
  window.addEventListener('offline', pintarSync);
}
</script>
